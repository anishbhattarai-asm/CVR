[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "code-video-renderer"
dynamic = ["version"]
description = "Turn source code into a typewriter-style video, rendered in your real VS Code colour theme."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Anish Bhattarai" }]
keywords = ["code", "video", "typewriter", "vscode", "theme", "syntax-highlighting", "animation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Video",
    "Topic :: Software Development :: Documentation",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.21",
    "pillow>=9.2",
    "pygments>=2.10",
    "imageio-ffmpeg>=0.4.7",
]

[project.optional-dependencies]
opencv = ["opencv-python>=4.5"]
dev = ["pytest>=7"]

[project.scripts]
cvr = "cvr.cli:main"

[project.gui-scripts]
cvr-gui = "cvr.gui:main"

[project.urls]
Homepage = "https://github.com/anishbhattarai-asm/CVR"
Issues = "https://github.com/anishbhattarai-asm/CVR/issues"

[tool.setuptools.dynamic]
version = { attr = "cvr.__version__" }

[tool.setuptools.package-data]
cvr = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
